<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale=1.0">
        <title>Attribute Seçici Uygulamalar</title>
        <style>
            a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-size: 20px;
            }
            a:link{
                color:blueviolet;
            }
            a:visited{
                color:blue
            }
            a:hover{
                color:cadetblue;
            }
            a:active{
                color: chocolate;
            }
        </style>
        </head>
        <body>
         <a href="#">AnaSayfa</a></br>
         <a href="#">İletişim</a></br>
         <a href="#">Hakkimizda</a></br>
         <a href="#">Galeri</a></br>
        </body>
