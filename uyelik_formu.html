<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
</head>
<body bgcolor="golden yellow">
    <h1>Lütfen Formu Eksiksiz Doldurunuz</h1>
<form>
    <fieldset>
        <legend>Üyelik Bilgileri</legend>
        <h3>Hesap Bilgileriniz</h3>
        <label>Kullanıcı adı</label>
        <input type="text" name="Kullanıcı Adı" required="required"> <br/><br/>
        <label>Eposta</label>
        <input type="text" name="Eposta" required="required"><br/><br/>
        <label>Parola</label>
        <input type="text" name="Parola" required="required"><br/><br/>
        <h3>Kişisel Bilgileriniz</h3>
        <label>Ad</label>
        <input type="text" name="Ad" required="required"> <br/><br/>
        <label>Soyad</label>
        <input type="text" name="Soyad" required="required"> <br/><br/>
        <label>Şehir</label>
        <select name="Şehir" size="1">
            <option value="Sakarya">Sakarya</option>
            <option value="Ankara">Ankara</option>
            <option value="İstanbul">İstanbul</option>
        </select><br><br>
        <label>Cinsiyet</label>
        <input type="radio" name="secim"/>Erkek
        <input type="radio" name="secim"/>Kadın<br><br>
        <label>Hobileriniz</label>
        <input type="checkbox" name="Sinema" />Sinema
        <input type="checkbox" name="Gezmek"/>Gezmek
        <input type="checkbox" name="Spor"/>Spor
        <input type="checkbox" name="Kitap"/>Kitap<br/><br/>
        <input type="submit" value="Kaydet"/>
        </fieldset>
</form>
</body>
