<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-witdh,initial-scale">
        <title>CSS Tablo Tasarım</title>
        <link rel="stylesheet"href="style3.css">
    </head>
        <body>
            <h1>Lütfen Formu Eksiksiz Doldurunuz</h1>
            <hr>

            <form>
                <h4>Hesap Bilgileriniz</h4>
                <p>
                    Kullanıcı Adı: <input type="email"name="eposta"placeholder="Eposta giriniz" required>
                </p>

                <p>
                    Parola: <input type="password" name="parola" placeholder="parola giriniz" required>
                </p>

                <h4>Kişisel Bilgileriniz</h4>

                <p>
                    Ad: <input type="text" name="Ad">
                </p>

                <p>
                    Soyad: <input type="text" name="Soyad">
                </p>

                <p>
                    Şehir:
                    <select name="Şehir">
                        <option>Seçiniz</option>
                        <option>Ankara</option>
                        <option>İstanbul</option>
                        <option>Sinop</option>
                    </select>
                </p>

                <p>
                    Cinsiyet:
                    <input type="radio" name="Cinsiyet">Erkek
                    <input type="radio" name="Cinsiyet">Kadın
                </p>

                <p>
                Hobileriniz:
                <input type="Checkbox" name="Hobileriniz">Sinema
                <input type="Checkbox" name="Hobileriniz">Gezmek
                <input type="Checkbox" name="Hobileriniz">Spor
                <input type="Checkbox" name="Hobileriniz">Kitap
                </p>

                <input type="submit" value="Kaydet">
            </form>
        </body>
        </html>
